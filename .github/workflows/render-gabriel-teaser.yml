name: Render Gabriel UI Teaser

on:
  push:
    branches:
      - codex/gabriel-teaser-freeware
    paths:
      - marketing/gabriel-teaser/render.sh
      - .github/workflows/render-gabriel-teaser.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    name: Render MP4 with FFmpeg
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out trailer source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install open-source render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Render authentic Gabriel UI workflow trailer
        run: bash marketing/gabriel-teaser/render.sh

      - name: Upload finished LinkedIn teaser
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gabriel-ui-workflow-teaser
          path: build/Gabriel_The_Defender_UI_Workflow_Teaser.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Publish finished MP4 on the trailer branch
        run: |
          cp build/Gabriel_The_Defender_UI_Workflow_Teaser.mp4 marketing/gabriel-teaser/Gabriel_The_Defender_UI_Workflow_Teaser.mp4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f marketing/gabriel-teaser/Gabriel_The_Defender_UI_Workflow_Teaser.mp4
          if git diff --cached --quiet; then
            echo "Rendered MP4 is already current."
            exit 0
          fi
          git commit -m "marketing: publish rendered Gabriel UI teaser"
          git push
