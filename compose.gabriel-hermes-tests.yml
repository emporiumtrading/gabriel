services:
  identity-tests:
    environment:
      GABRIEL_REQUIRE_HERMES: '1'
      GABRIEL_TOOLBUS_CA_FILE: /run/secrets/toolbus_ca
      GABRIEL_TOOLBUS_TOKEN_FILE: /run/secrets/toolbus_token
    secrets: [toolbus_ca, toolbus_token]
  hermes:
    build:
      context: .
      dockerfile: gabriel/hermes/Dockerfile
    user: '10001:10001'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    networks: [toolbus]
    tmpfs: ['/tmp:rw,noexec,nosuid,nodev,size=256m']
    environment:
      GABRIEL_TOOLBUS_CA_FILE: /run/secrets/toolbus_ca
      GABRIEL_TOOLBUS_CERT_FILE: /run/secrets/toolbus_certificate
      GABRIEL_TOOLBUS_KEY_FILE: /run/secrets/toolbus_key
      GABRIEL_TOOLBUS_TOKEN_FILE: /run/secrets/toolbus_token
    secrets: [toolbus_ca, toolbus_certificate, toolbus_key, toolbus_token]
    healthcheck:
      test: [CMD, /opt/hermes/.venv/bin/python, /opt/gabriel-hermes/server.py, health]
      interval: 3s
      timeout: 3s
      retries: 20
