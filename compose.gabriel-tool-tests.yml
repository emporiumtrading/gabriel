# Test-only bridge: parser has no DB network, environment, secret or evidence mount.
services:
  identity-tests:
    networks: [identity, toolbus]
    environment:
      GABRIEL_REQUIRE_TOOLBOX: '1'
      GABRIEL_TOOLBUS_CA_FILE: /run/secrets/toolbus_ca
      GABRIEL_TOOLBUS_TOKEN_FILE: /run/secrets/toolbus_token
    secrets: [toolbus_ca, toolbus_token]
  investigation-tools:
    image: gabriel-toolbox-tests:dev
    build:
      context: .
      dockerfile: gabriel/identity/Dockerfile
      target: production
      args:
        IDENTITY_BASE: ${GABRIEL_IDENTITY_BASE:-python@sha256:5fb4bc53dd0180955e31e5245b648bbb24a4ac4ab03a1de81513642325220bcd}
    user: '10001:10001'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 256m
    cpus: 1
    networks: [toolbus]
    tmpfs: ['/tmp:rw,noexec,nosuid,nodev,size=8m']
    entrypoint: [python, -m, gabriel.toolbox.server]
    environment:
      GABRIEL_TOOLBUS_CA_FILE: /run/secrets/toolbus_ca
      GABRIEL_TOOLBUS_CERT_FILE: /run/secrets/toolbus_certificate
      GABRIEL_TOOLBUS_KEY_FILE: /run/secrets/toolbus_key
      GABRIEL_TOOLBUS_TOKEN_FILE: /run/secrets/toolbus_token
    secrets: [toolbus_ca, toolbus_certificate, toolbus_key, toolbus_token]
    healthcheck:
      test: [CMD, python, -m, gabriel.toolbox.server, health]
      interval: 2s
      timeout: 3s
      retries: 20
networks:
  toolbus:
    internal: true
secrets:
  toolbus_ca:
    file: ${GABRIEL_TOOLBUS_TLS_DIR:?Prepare an external tool-bus TLS directory}/ca.pem
  toolbus_certificate:
    file: ${GABRIEL_TOOLBUS_TLS_DIR}/server.pem
  toolbus_key:
    file: ${GABRIEL_TOOLBUS_TLS_DIR}/server.key
  toolbus_token:
    file: ${GABRIEL_TOOLBUS_TLS_DIR}/token
